name: Workflow contract
on:
  push:
  pull_request:
jobs:
  validate:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore local branch inventory
        shell: pwsh
        run: |
          $currentBranch = git branch --show-current
          if ($LASTEXITCODE) { throw 'Cannot read the current branch.' }
          $remoteRefs = @(git for-each-ref --format='%(refname:short)' refs/remotes/origin/)
          if ($LASTEXITCODE) { throw 'Cannot read remote branch inventory.' }
          foreach ($remoteRef in $remoteRefs) {
            if ($remoteRef -eq 'origin/HEAD') { continue }
            $branch = $remoteRef.Substring(7)
            if ($branch -eq $currentBranch) { continue }
            git branch --force $branch $remoteRef 2>$null
            if ($LASTEXITCODE) { throw "Cannot restore local branch $branch from $remoteRef." }
          }
      - name: Lint
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File ./workflow-kit.ps1 -Command lint -RepoRoot . -Strict
      - name: Preview scheduler
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File ./agent-loop.ps1 -DryRun -RepoRoot .
      - name: Install Pester when unavailable
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'3.4' -and $_.Version.Major -lt 5 })) {
            Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Force -SkipPublisherCheck
          }
      - name: Fixture acceptance tests
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File ./tests/run-tests.ps1
      - name: Whitespace
        shell: pwsh
        run: git diff --check
